name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (audit pass 19, SEC4): every job here only reads the
# repository. Without this block the jobs inherit the repository's default
# token scope, which can be read/write. Nothing here pushes either, so the
# checkouts drop the token from .git/config (persist-credentials: false) and
# a later step -- a dependency's install hook, say -- cannot read it.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the release as a comment
# (audit pass 19, SEC3). A tag can be moved by whoever controls the action's
# repository; a SHA cannot. Dependabot updates SHA and comment together.
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.12 is the floor pyproject declares (audit pass 19, F10; it is
        # what groundfield requires), 3.14 the version the docs and the
        # release workflow use. Every minor version in between is tested so
        # the declared range is a claim the CI actually backs.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install project
        run: poetry install --no-interaction --with dev

      - name: Run pytest with coverage
        run: poetry run pytest --cov=groundinsight --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-docs-${{ runner.os }}-py3.14-${{ hashFiles('**/poetry.lock') }}

      - name: Install project with docs group
        run: poetry install --no-interaction --with docs

      # ``docs.yml`` only runs on ``main``, i.e. after the merge -- a broken
      # cross-reference was therefore always found too late, on the branch
      # that publishes the site. ``--strict`` turns every mkdocs warning into
      # an error, which is what the deploy already relies on.
      - name: Build the site strictly
        run: poetry run mkdocs build --strict

  notebooks:
    name: Curated notebooks execute
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install project with docs and dev groups
        run: >-
          poetry install --no-interaction --with docs,dev
          --extras pandapower

      # ``mkdocs.yml`` sets ``execute: false``, so the notebooks under
      # ``docs/examples`` are published with their *stored* output. Nothing
      # checked that the stored output still matched the code:
      # ``mv_ring_transient.ipynb`` shipped a reduction factor of 0.904 next
      # to a cell that raised ``KeyError: 'F1'`` when run. This job runs them.
      - name: Execute the curated example notebooks
        run: >-
          poetry run jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=600
          --output-dir /tmp/nbconvert
          docs/examples/*.ipynb
