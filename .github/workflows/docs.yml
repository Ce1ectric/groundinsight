name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (audit pass 19, SEC4): read-only by default; the deploy job
# below asks for the one write scope it needs. Every action is pinned to a
# full commit SHA with the release as a comment (SEC3); Dependabot updates
# both together.
permissions:
  contents: read

# One deploy at a time. A merge and the release commit right after it start
# two runs within seconds; the second one built on the gh-pages tip it had
# checked out, the first one moved that tip, and the second push was rejected
# as a non-fast-forward update by the repository ruleset. Queued, the second
# run checks out after the first has pushed. A pending run is replaced by a
# newer one, so the site always ends at the latest commit of main.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # mkdocs gh-deploy pushes the built site to gh-pages
    steps:
      - name: Check out repository
        # The checkout keeps its credentials on purpose: gh-deploy pushes
        # with git, using the token the checkout stores.
        # zizmor: ignore[artipacked] gh-deploy needs the persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-docs-pandapower-${{ runner.os }}-py3.14-${{ hashFiles('**/poetry.lock') }}

      # The build executes the example notebooks (mkdocs.yml); one of them
      # imports pandapower.
      - name: Install project with docs group and pandapower extra
        run: poetry install --no-interaction --with docs --extras pandapower

      # --strict (audit pass 19, STD11): the pull-request job in ci.yml
      # builds strictly, but this push to main is what gets published, and
      # without the flag it would publish a site with broken references.
      # No --force: the repository ruleset rejects non-fast-forward updates
      # on every branch, gh-pages included, so the deploy has to build on the
      # current tip, which the concurrency group above guarantees.
      - name: Deploy to GitHub Pages
        run: poetry run mkdocs gh-deploy --strict --clean --verbose
