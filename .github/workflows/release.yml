name: Release

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag that already exists. Use this when a publish
  # failed for a reason unrelated to the build (a missed environment
  # approval, a PyPI outage) so the tag does not have to be moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.5.0)"
        required: true
        type: string

# Least privilege (audit pass 19, SEC4): read-only by default. publish-pypi
# and github-release each ask for the one write scope they need; test and
# build only read. Checkouts drop the token from .git/config
# (persist-credentials: false) because no job here pushes with git.
#
# Every action is pinned to a full commit SHA with the release as a comment
# (SEC3). The publish step runs with id-token: write, so a moving reference
# there -- pypa's branch release/v1 -- would let whoever moves it decide what
# runs with the token that publishes to PyPI. Dependabot updates SHA and
# comment together.
permissions:
  contents: read

jobs:
  # A tag can be pushed from a machine where the suite was never run, and the
  # publish is irreversible: a version number on PyPI cannot be reused. The
  # test gate runs on the tagged commit itself, so what is published is what
  # was tested. It duplicates ci.yml on purpose -- ci.yml runs on branches and
  # pull requests, and neither of those is what ``release.yml`` builds from.
  test:
    name: Tests on the tagged commit
    runs-on: ubuntu-latest
    env:
      # Strict mode, as in ci.yml: a missing test dependency fails the gate
      # instead of skipping the tests that need it (tests/conftest.py).
      GROUNDINSIGHT_CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install project
        run: poetry install --no-interaction --with dev

      - name: Run pytest
        run: poetry run pytest -q

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # scripts/release.py keeps three files in sync. A tag that points at a
      # commit where they disagree would publish a wrongly numbered artifact,
      # so check all three rather than pyproject alone.
      - name: Verify tag matches every version source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          expected = tag[1:] if tag.startswith("v") else tag

          # The GUI distribution (gui/) is released with the library: same
          # version, and it pins exactly this library release.
          sources = [
              ("pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              ("src/groundinsight/__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
              ("CITATION.cff", r'^version:\s*"?([^"\s]+)"?'),
              ("gui/pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              ("gui/pyproject.toml", r'"groundinsight==([^"]+)"'),
              ("gui/groundinsight_gui/__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
          ]

          problems = []
          for path, pattern in sources:
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(pattern, text, re.MULTILINE)
              if match is None:
                  problems.append(f"{path}: no version declaration found")
              elif match.group(1) != expected:
                  problems.append(f"{path}: declares {match.group(1)}")

          if problems:
              for problem in problems:
                  print(f"::error::tag {tag} expects {expected} — {problem}")
              sys.exit(1)

          print(f"tag {tag} matches all version sources ({expected})")
          PY

      - name: Build distributions
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/groundinsight
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing, nothing else
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # The workflow can be re-run for an existing tag, so a partially
          # completed upload must not turn the retry into a hard failure.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release and attaches the dists
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
