# Cyclomatic complexity ratchet (radon cc) for src/groundinsight, read by
# tests/test_audit_pass19_standards.py. A function above the limit is listed
# here with its complexity when the ratchet was set; it may get simpler, never
# more complex, and a new function above the limit fails the test. When a
# function drops to the limit or below, or disappears, its line goes: the list
# only shrinks. Keys are <path below src/groundinsight>::<qualified name>; a
# nested function is named after its enclosing one (outer.inner).

