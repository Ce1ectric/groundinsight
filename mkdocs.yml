site_name: groundinsight
site_description: Simulation of grounding systems in electrical power grids.
site_url: https://ce1ectric.github.io/groundinsight/
repo_url: https://github.com/Ce1ectric/groundinsight
repo_name: Ce1ectric/groundinsight
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024&ndash;2026 Christian Ehlert

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
  - mkdocs-jupyter:
      execute: false
      include_source: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ce1ectric/groundinsight

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Examples:
      - Overview: examples/index.md
      - Simple example: examples/simple.ipynb
      - CIRED case: examples/cired.ipynb
      - Low-voltage network: examples/low_voltage.ipynb
  - API reference:
      - Overview: api/index.md
      - Network operations: api/network_operations.md
      - Core models: api/core_models.md
      - Electrical network: api/electrical_network.md
      - Pathfinder: api/pathfinder.md
      - Plotting: api/plotting.md
      - Database: api/database.md
