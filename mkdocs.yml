site_name: groundinsight
site_description: Simulation of grounding systems in electrical power grids.
site_url: https://ce1ectric.github.io/groundinsight/
repo_url: https://github.com/Ce1ectric/groundinsight
repo_name: Ce1ectric/groundinsight
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024&ndash;2026 Christian Ehlert

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # Pass-6 / Pass-7 audit fix: the public-API docstrings
            # were migrated to numpy-style on 2026-05-14 but the
            # mkdocstrings parser stayed on Google, so Parameters /
            # Returns sections rendered as plain text and the
            # per-field type annotations dropped silently.
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
  - mkdocs-jupyter:
      execute: false
      include_source: true

extra_javascript:
  - javascripts/mathjax.js
  # polyfill.io was removed in 2026-05 (domain was sold and later served
  # malicious JavaScript). MathJax 3 does not require a polyfill for
  # modern browsers; see groundmeas/mkdocs.yml for the same change.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ce1ectric/groundinsight

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Transient simulation: transient.md
  - Audit log: audit-log.md
  - Examples:
      - Overview: examples/index.md
      - Minimal example: examples/minimal.ipynb
      - MV ring (stationary): examples/mv_ring.ipynb
      - MV ring (transient): examples/mv_ring_transient.ipynb
      - Pandapower import: examples/pandapower_import.ipynb
      - Fault sweep: examples/fault_sweep.ipynb
  # The ``notebooks/`` directory at the project root is *not* part of the
  # published site. It was listed here as a "Research notebooks" section
  # until 2026-07-19, but mkdocs only collects files below ``docs_dir``,
  # so every ``../notebooks/*.ipynb`` entry was reported as
  #   "A reference to '...' is included in the 'nav' configuration,
  #    which is not found in the documentation files"
  # and silently dropped -- the section never appeared on the site. The
  # cause is the path, not a missing file: placing a real notebook at the
  # exact nav path reproduces the same warning. Since ``mkdocs gh-deploy``
  # runs without ``--strict``, the build stayed green while the section
  # vanished. ``/notebooks`` is also gitignored, so the files would not
  # reach a CI checkout in the first place. Curated notebooks belong in
  # ``docs/examples/`` (see the Examples section above); the research
  # notebooks stay a local working artefact.
  - API reference:
      - Overview: api/index.md
      - Network operations: api/network_operations.md
      - Core models: api/core_models.md
      - Electrical network: api/electrical_network.md
      - Pathfinder: api/pathfinder.md
      - Plotting: api/plotting.md
      - Database: api/database.md
      - "I/O — network importers": api/io.md
      - Outage studies: api/outage.md
      - Analysis: api/analysis.md
      - Transient simulations: api/transient.md
