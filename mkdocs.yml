site_name: groundinsight
site_description: Simulation of grounding systems in electrical power grids.
site_url: https://ce1ectric.github.io/groundinsight/
repo_url: https://github.com/Ce1ectric/groundinsight
repo_name: Ce1ectric/groundinsight
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024&ndash;2026 Christian Ehlert

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Example code lives in docs/snippets/*.py and is included with
  # ``--8<-- "docs/snippets/<file>.py:<section>"``; the test suite runs the
  # same files (DOC13). check_paths turns a missing snippet into a build
  # error instead of an empty block.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Pages that moved keep their old address (audit pass 19, D1): the plugin
  # writes a small HTML page at the old path that forwards to the new one,
  # and the forwarding keeps the #anchor of the old link. The page a moved
  # page forwards to carries the old anchors where its sections went apart
  # (explanation/index.md maps every section of the former Concepts page).
  - redirects:
      redirect_maps:
        concepts.md: explanation/index.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # Pass-6 / Pass-7 audit fix: the public-API docstrings
            # were migrated to numpy-style on 2026-05-14 but the
            # mkdocstrings parser stayed on Google, so Parameters /
            # Returns sections rendered as plain text and the
            # per-field type annotations dropped silently.
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
  - mkdocs-jupyter:
      execute: false
      include_source: true
      # Notebooks only. The plugin's default also converts every *.py file
      # under docs/ into a notebook page; the scripts in docs/snippets/ are
      # example code that is included into pages and published as files.
      include: ["*.ipynb"]

# Build hooks. reference_cases.py writes the table of the closed-form
# reference cases into explanation/verification.md from REFERENCE_CASES and
# one run of gi.run_reference_cases(), so the table cannot go stale.
hooks:
  - docs/hooks/reference_cases.py

# The hooks are build code, not pages or downloads.
exclude_docs: |
  hooks/

extra_javascript:
  - javascripts/mathjax.js
  # polyfill.io was removed in 2026-05 (domain was sold and later served
  # malicious JavaScript). MathJax 3 does not require a polyfill for
  # modern browsers; see groundmeas/mkdocs.yml for the same change.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ce1ectric/groundinsight

# Strict link checking (audit pass 19, DOC9). Without this block mkdocs
# checks anchors only at INFO level, so a link to a heading that had been
# renamed built without a word. ``omitted_files`` also catches a page that
# exists but cannot be reached from the navigation.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Diataxis structure (audit pass 19, decision D1): tutorials to learn,
# how-to guides to get a task done, explanation to understand the model,
# examples, reference to look things up, and the project pages. With
# ``navigation.tabs`` every top-level entry becomes a tab.
#
# The ``notebooks/`` directory at the project root is *not* part of the
# site: mkdocs only collects files below ``docs_dir``, and ``/notebooks`` is
# gitignored, so it never reaches a CI checkout. Curated notebooks belong in
# ``docs/examples/``.
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - How-to guides:
      - Bus and branch types from data sheets: howto/types-from-datasheets.md
      - Compare results with EN 50522 limits: howto/en50522-check.md
  - Understanding the model:
      - explanation/index.md
      - Model and assumptions: explanation/theory.md
      - Impedance formulas and where they come from: explanation/formulas.md
      - Phase currents in rings and meshes: explanation/phase-currents.md
      - Reduction factors and earthing impedance: explanation/reduction-factors.md
      - Splitting the network, location response: explanation/decomposition.md
      - "Direct current (f = 0)": explanation/dc.md
      - Transient simulation: transient.md
      - Verification and validation: explanation/verification.md
      - Standards and scope: explanation/standards.md
  - Examples:
      - Overview: examples/index.md
      - Minimal example: examples/minimal.ipynb
      - MV ring (stationary): examples/mv_ring.ipynb
      - MV ring (transient): examples/mv_ring_transient.ipynb
      - Pandapower import: examples/pandapower_import.ipynb
      - Fault sweep: examples/fault_sweep.ipynb
      - Fault decomposition: examples/fault_decomposition.ipynb
  - Reference:
      - Conventions and units: reference/conventions.md
      - Formula syntax: reference/formula-syntax.md
      - Glossary and symbols: reference/glossary.md
      - API:
          - Overview: api/index.md
          - Network operations: api/network_operations.md
          - Service functions: api/service.md
          - Core models: api/core_models.md
          - Electrical network: api/electrical_network.md
          - Pathfinder: api/pathfinder.md
          - Plotting: api/plotting.md
          - Database: api/database.md
          - "I/O — network importers": api/io.md
          - Outage studies: api/outage.md
          - Parameter sweeps: api/sweep.md
          - Analysis: api/analysis.md
          - Fault-location decomposition: api/decomposition.md
          - Location response: api/response.md
          - Reference cases: api/reference.md
          - Statistics and classification: api/statistics.md
          - Transient simulations: api/transient.md
  - Project:
      - Audit log: audit-log.md
