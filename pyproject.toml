[tool.poetry]
name = "groundinsight"
version = "0.4.0"
description = "Simulation for grounding systems of electrical power grids"
authors = ["Christian Ehlert <christian.ehlert@mailbox.org>"]
license = "MIT"
repository = "https://github.com/Ce1ectric/groundinsight"
documentation = "https://ce1ectric.github.io/groundinsight/"
readme = "README.md"
packages = [
    { include = "groundinsight", from = "src" },
    { include = "scripts" },
]

[tool.poetry.dependencies]
python = "^3.14"
pydantic = "^2.12"
numpy = "^2.1.0"
sqlalchemy = "^2.0.32"
polars = "^1.5.0"
sympy = "^1.13.2"
matplotlib = "^3.10"
scipy = "^1.16"
pillow = "^11.3.0"
# Optional importer dependencies, installed via the matching extra.
pandapower = { version = "^3.0", optional = true }


[tool.poetry.extras]
pandapower = ["pandapower"]


[tool.poetry.group.dev.dependencies]
alembic = "^1.13.2"
sqlalchemy-stubs = "^0.4"
ipykernel = "^6.29.5"
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
black = "^24.8.0"
pandapower = "^3.0"
pyzmq = "^27.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.34"
mkdocstrings = { extras = ["python"], version = "^0.26.1" }
pymdown-extensions = "^10.9"
mkdocs-jupyter = "^0.25.0"

[tool.poetry.scripts]
release = "scripts.release:main"
generate-third-party-licenses = "scripts.generate_third_party_licenses:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
