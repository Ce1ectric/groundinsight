[tool.poetry]
name = "groundinsight"
version = "0.6.0"
description = "Simulation for grounding systems of electrical power grids"
authors = ["Christian Ehlert <christian.ehlert@mailbox.org>"]
license = "MIT"
repository = "https://github.com/Ce1ectric/groundinsight"
documentation = "https://ce1ectric.github.io/groundinsight/"
readme = "README.md"
# ``scripts`` is deliberately NOT packaged. It holds maintainer tooling --
# the release bumper and the third-party-licence generator -- which has no
# business in a user's site-packages, and shipping it made the top-level name
# ``scripts`` importable from any environment that installs groundinsight.
packages = [
    { include = "groundinsight", from = "src" },
]

[tool.poetry.dependencies]
# 0.6.1: relaxed from "^3.14". The package runs unchanged on 3.13 (full suite
# green), and 3.13 is what the distribution pythons and most pandapower
# environments still ship. The CI matrix covers both.
python = "^3.13"
pydantic = "^2.12"
numpy = "^2.1.0"
sqlalchemy = "^2.0.32"
polars = "^1.5.0"
sympy = "^1.13.2"
matplotlib = "^3.10"
scipy = "^1.16"
pillow = "^11.3.0"
# Optional importer dependencies, installed via the matching extra.
pandapower = { version = "^3.0", optional = true }


[tool.poetry.extras]
pandapower = ["pandapower"]


[tool.poetry.group.dev.dependencies]
alembic = "^1.13.2"
sqlalchemy-stubs = "^0.4"
ipykernel = "^6.29.5"
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
black = "^24.8.0"
pandapower = "^3.0"
pyzmq = "^27.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.34"
mkdocstrings = { extras = ["python"], version = "^0.26.1" }
pymdown-extensions = "^10.9"
mkdocs-jupyter = "^0.25.0"

# No [tool.poetry.scripts] block on purpose. The two maintainer commands used
# to install executables named ``release`` and
# ``generate-third-party-licenses`` into the PATH of every user who installs
# groundinsight -- a name as generic as ``release`` shadowing whatever else
# the user has is not something a library should do. Run them from the
# repository root instead:
#
#     poetry run python scripts/release.py patch
#     poetry run python scripts/generate_third_party_licenses.py

[tool.pytest.ini_options]
testpaths = ["tests", "src/groundinsight"]
addopts = "-ra --doctest-modules"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
